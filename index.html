<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Moldforge</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #15130f;
        color: #f8f1df;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
        background:
          radial-gradient(circle at top left, rgba(218, 164, 82, 0.18), transparent 32rem),
          #15130f;
      }

      button, input { font: inherit; }

      .app {
        display: grid;
        grid-template-columns: minmax(20rem, 24rem) minmax(0, 1fr);
        height: 100vh;
      }

      aside {
        display: flex;
        flex-direction: column;
        gap: 1rem;
        padding: 1.2rem;
        overflow-y: auto;
        background: rgba(25, 23, 18, 0.92);
        border-right: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 1rem 0 3rem rgba(0, 0, 0, 0.25);
      }

      main { position: relative; min-width: 0; }
      #canvas-wrap { width: 100%; height: 100%; }
      canvas { display: block; width: 100%; height: 100%; }

      h1 { margin: 0; font-size: clamp(1.8rem, 4vw, 2.6rem); letter-spacing: -0.05em; }
      p { margin: 0; color: #cabf9f; line-height: 1.45; }
      .eyebrow { color: #f0b35f; font-size: 0.78rem; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; }

      .panel {
        display: grid;
        gap: 0.75rem;
        padding: 0.9rem;
        border: 1px solid rgba(255, 255, 255, 0.09);
        border-radius: 1rem;
        background: rgba(255, 255, 255, 0.045);
      }

      .drop {
        display: grid;
        place-items: center;
        min-height: 8rem;
        padding: 1rem;
        text-align: center;
        cursor: pointer;
        border: 1px dashed rgba(240, 179, 95, 0.7);
        border-radius: 1rem;
        background: rgba(240, 179, 95, 0.08);
        transition: 0.18s ease;
      }
      .drop:hover, .drop.hover { background: rgba(240, 179, 95, 0.16); transform: translateY(-1px); }
      .drop.loaded { border-style: solid; border-color: rgba(112, 198, 148, 0.9); }
      .drop input { display: none; }
      strong { color: #fff6df; }

      label, .label { color: #f2dfb5; font-size: 0.88rem; font-weight: 700; }
      .row { display: grid; gap: 0.4rem; }
      .range-row { display: grid; grid-template-columns: 1fr auto; gap: 0.75rem; align-items: center; }
      input[type="range"] { width: 100%; accent-color: #f0b35f; }
      input[type="checkbox"] { accent-color: #f0b35f; }
      .value { color: #ffe4ac; min-width: 2.5rem; text-align: right; font-variant-numeric: tabular-nums; }
      .check { display: flex; gap: 0.55rem; align-items: center; color: #e6dcc3; }
      .disabled-when-auto { opacity: 0.45; }

      .segmented { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 0.35rem; }
      .seg, button {
        border: 0;
        border-radius: 0.75rem;
        padding: 0.65rem 0.8rem;
        color: #f8f1df;
        background: rgba(255, 255, 255, 0.09);
        cursor: pointer;
        transition: 0.18s ease;
      }
      .seg:hover, button:hover:not(:disabled) { background: rgba(255, 255, 255, 0.15); }
      .seg.active { background: #f0b35f; color: #23170a; font-weight: 800; }
      button.primary { background: #f0b35f; color: #211407; font-weight: 850; }
      button:disabled { cursor: not-allowed; opacity: 0.42; }
      .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }
      .actions .wide { grid-column: 1 / -1; }

      .hint { font-size: 0.8rem; color: #b4aa91; }
      kbd { padding: 0.12rem 0.35rem; border-radius: 0.35rem; background: rgba(255,255,255,0.12); }

      .toast {
        position: absolute;
        left: 50%;
        bottom: 1.4rem;
        max-width: min(42rem, calc(100% - 2rem));
        transform: translate(-50%, 1rem);
        opacity: 0;
        pointer-events: none;
        padding: 0.85rem 1rem;
        border-radius: 999px;
        color: #251809;
        background: #ffd892;
        box-shadow: 0 1rem 3rem rgba(0, 0, 0, 0.35);
        transition: 0.2s ease;
        z-index: 3;
      }
      .toast.show { opacity: 1; transform: translate(-50%, 0); }

      .spinner {
        display: inline-block;
        width: 1em;
        height: 1em;
        margin-right: 0.35rem;
        vertical-align: -0.16em;
        border: 2px solid rgba(33,20,7,0.28);
        border-top-color: #211407;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }

      @media (max-width: 820px) {
        body { overflow: auto; }
        .app { grid-template-columns: 1fr; height: auto; min-height: 100vh; }
        aside { min-height: auto; }
        main { height: 62vh; min-height: 28rem; }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <aside>
        <header>
          <div class="eyebrow">STL mold generator</div>
          <h1>Moldforge</h1>
          <p>Upload an STL, preview it, generate a split mold shell, then download both printable halves.</p>
        </header>

        <label id="drop" class="drop">
          <input id="file-input" type="file" accept=".stl,model/stl" />
          <span id="drop-text"><strong>Drop an STL here</strong><br />or click to choose a file</span>
        </label>

        <section class="panel" aria-label="Split settings">
          <div class="row">
            <div class="label">Resolution</div>
            <div id="res-seg" class="segmented">
              <button class="seg" type="button" data-res="32">Fast</button>
              <button class="seg active" type="button" data-res="64">Balanced</button>
              <button class="seg" type="button" data-res="96">Fine</button>
            </div>
            <p class="hint">Higher settings are reserved for future contour sampling; the current split keeps output crisp.</p>
          </div>

          <label class="check">
            <input id="autoOpt" type="checkbox" checked />
            Auto-pick split axis
          </label>

          <div id="biasRow" class="row">
            <div class="range-row">
              <label for="bias">Manual axis bias</label>
              <span id="biasVal" class="value">50</span>
            </div>
            <input id="bias" type="range" min="0" max="100" value="50" />
          </div>

          <div class="row">
            <div class="range-row">
              <label for="posX">Plane offset X</label>
              <span id="posXVal" class="value">0</span>
            </div>
            <input id="posX" type="range" min="-50" max="50" step="0.5" value="0" />
          </div>

          <div class="row">
            <div class="range-row">
              <label for="posY">Plane offset Y</label>
              <span id="posYVal" class="value">0</span>
            </div>
            <input id="posY" type="range" min="-50" max="50" step="0.5" value="0" />
          </div>

          <div class="row">
            <div class="range-row">
              <label for="smoothing">Smoothing passes</label>
              <span id="smoothingVal" class="value">0</span>
            </div>
            <input id="smoothing" type="range" min="0" max="4" step="1" value="0" />
          </div>
        </section>

        <section class="panel" aria-label="View settings">
          <div class="row">
            <div class="label">View</div>
            <div id="view-seg" class="segmented">
              <button class="seg active" type="button" data-view="original">Original</button>
              <button class="seg" type="button" data-view="mold">Mold</button>
              <button class="seg" type="button" data-view="front">Front</button>
              <button class="seg" type="button" data-view="back">Back</button>
            </div>
          </div>

          <div class="row">
            <div class="label">Default download half</div>
            <div id="half-seg" class="segmented">
              <button class="seg active" type="button" data-half="front">Front</button>
              <button class="seg" type="button" data-half="back">Back</button>
            </div>
          </div>

          <label class="check">
            <input id="wireframe" type="checkbox" />
            Wireframe overlay <span class="hint">(<kbd>W</kbd>)</span>
          </label>
          <button id="resetView" type="button">Reset camera</button>
        </section>

        <section class="panel actions" aria-label="Generate and export">
          <button id="generateBtn" class="primary wide" type="button" disabled><span id="generateLabel">Contour Split</span></button>
          <button id="dlFront" type="button" disabled>Download front</button>
          <button id="dlBack" type="button" disabled>Download back</button>
        </section>
      </aside>

      <main>
        <div id="canvas-wrap" aria-label="3D preview"></div>
        <div id="toast" class="toast" role="status" aria-live="polite"></div>
      </main>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
